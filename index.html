<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funil Vivo — Portal</title>
<style>
:root { color-scheme: light; }
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:14px}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.brand{font-size:26px;font-weight:800;color:#1F3864;letter-spacing:.5px}
.brand span{color:#2E75B6}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:32px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.loginbox .brand{text-align:center;font-size:30px;margin-bottom:4px}
.loginbox .tag{text-align:center;color:#6b7280;margin-bottom:22px;font-size:13px}
label{display:block;font-size:12px;color:#6b7280;margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:9px;font-size:14px;background:#fff}
input:focus,select:focus{outline:none;border-color:#2E75B6}
.btn{border:none;border-radius:9px;padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer;background:#2E75B6;color:#fff}
.btn:hover{background:#255f96}
.btn.block{width:100%;margin-top:16px}
.btn.sec{background:#fff;color:#b91c1c;border:1px solid #fca5a5;padding:7px 14px;font-size:12px}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{background:#fff;color:#2E75B6;border:1px solid #9cc3e6}
.msg{margin-top:12px;font-size:13px;text-align:center;min-height:18px}
.msg.err{color:#b91c1c}.msg.ok{color:#15803d}
#app{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.nav{display:flex;gap:8px;margin:0 0 16px}
.nav button{background:#fff;border:1px solid #e5e7eb;color:#374151;border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px}
.nav button.active{background:#1F3864;color:#fff;border-color:#1F3864}
.who{color:#6b7280;font-size:13px}
.badge{display:inline-block;background:#eef2ff;color:#4338ca;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;margin-left:6px;text-transform:uppercase}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.kpi{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 16px}
.kpi .label{color:#6b7280;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.kpi .val{font-size:24px;font-weight:800;margin-top:4px}
.kpi .val.blue{color:#2E75B6}.kpi .val.green{color:#15803d}.kpi .val.amber{color:#b45309}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:15px;color:#1F3864}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.formrow{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #f0f0f0}
th{color:#6b7280;font-weight:600;font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600}
.s-ativo,.s-publicado,.s-ativa,.s-concluida,.s-conectado,.s-testado{background:#dcfce7;color:#15803d}
.s-onboarding,.s-fazendo,.s-rascunho,.s-aprovacao,.s-novo{background:#dbeafe;color:#1d4ed8}
.s-pendente,.s-pausada,.s-ideia,.s-desconectado{background:#fef9c3;color:#854d0e}
.s-bloqueada,.s-erro{background:#fee2e2;color:#b91c1c}
.metric{display:inline-block;background:#f1f5f9;border-radius:8px;padding:6px 10px;margin:0 8px 8px 0;font-size:12px}
.metric b{color:#2E75B6}
.log{font-size:13px;padding:8px 0;border-bottom:1px solid #f0f0f0}.log b{color:#1F3864}.log .r{color:#4b5563}
.muted{color:#9ca3af;font-size:12px}
.appr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border:1px solid #ffe69c;background:#fffdf5;border-radius:9px;margin-bottom:8px}
.stage{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.stage .bar{height:22px;background:linear-gradient(90deg,#2E75B6,#5b9bd5);border-radius:5px;min-width:4px}
.stage .lbl{width:96px;color:#374151;text-transform:capitalize;font-size:12px}
.stage .num{color:#6b7280;font-size:12px}
.hint{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:9px;padding:10px 12px;font-size:12px;margin-bottom:14px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="loginbox">
    <div class="brand">FUNIL <span>VIVO</span></div>
    <div class="tag">Portal da agência</div>
    <form id="loginForm">
      <label>E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label>Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <button class="btn block" type="submit" id="loginBtn">Entrar</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">FUNIL <span>VIVO</span></div>
      <div>
        <span class="who" id="who"></span>
        <button class="btn sec" id="trocarSenha" style="color:#2E75B6;border-color:#9cc3e6;margin-right:6px">Trocar senha</button>
        <button class="btn sec" id="logout">Sair</button>
      </div>
    </div>
    <div class="nav" id="nav"></div>
    <div id="view"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://myamzjypptifoxulahvo.supabase.co";
const SUPABASE_KEY = "sb_publishable_9sdEIYPZVDyJ4-1IPQugaw_22KlmPtK";
const API_URL = "https://api.funilvivo.com.br";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function apiCall(path, method="GET", body){
  const { data:{ session } } = await sb.auth.getSession();
  const token = session ? session.access_token : "";
  const res = await fetch(API_URL+path, {
    method,
    headers: { "Content-Type":"application/json", "Authorization":"Bearer "+token },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data; try { data = await res.json(); } catch { data = {}; }
  if(!res.ok) throw new Error(data.error || ("erro "+res.status));
  return data;
}

const $ = s => document.querySelector(s);
const brl = n => "R$ " + Number(n||0).toLocaleString("pt-BR");
const esc = s => (""+(s==null?"":s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const show = (el,on)=>{ el.style.display = on ? "block" : "none"; };
let PAPEL = "cliente";

$("#loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const msg=$("#loginMsg"); msg.className="msg"; msg.textContent="Entrando…";
  $("#loginBtn").disabled=true;
  const { error } = await sb.auth.signInWithPassword({ email:$("#email").value.trim(), password:$("#senha").value });
  $("#loginBtn").disabled=false;
  if(error){ msg.className="msg err"; msg.textContent = "Não foi possível entrar: " + error.message; return; }
  msg.textContent=""; boot();
});

$("#logout").addEventListener("click", async ()=>{ await sb.auth.signOut(); location.reload(); });
$("#trocarSenha").addEventListener("click", async ()=>{
  const nova = prompt("Digite a nova senha (mínimo 6 caracteres):");
  if(!nova) return;
  if(nova.length < 6){ alert("A senha precisa ter ao menos 6 caracteres."); return; }
  const { error } = await sb.auth.updateUser({ password: nova });
  alert(error ? ("Erro: " + error.message) : "Senha alterada com sucesso!");
});

async function boot(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user){ show($("#login"),true); show($("#app"),false); return; }
  show($("#login"),false); show($("#app"),true);
  let { data: perfil } = await sb.from("perfis").select("*").eq("id", user.id).maybeSingle();
  PAPEL = perfil ? perfil.papel : "cliente";
  const nome = (perfil && perfil.nome) || user.email;
  $("#who").innerHTML = esc(nome) + ' <span class="badge">' + esc(PAPEL) + '</span>';

  if(PAPEL === "admin" || PAPEL === "equipe"){
    $("#nav").innerHTML = '<button id="tabPainel" class="active">Painel</button><button id="tabCanais">Canais</button>';
    $("#tabPainel").onclick = ()=>{ setTab("painel"); viewEquipe(); };
    $("#tabCanais").onclick = ()=>{ setTab("canais"); viewCanais(); };
    viewEquipe();
  } else {
    $("#nav").innerHTML = "";
    viewCliente();
  }
}
function setTab(t){
  const p=$("#tabPainel"), c=$("#tabCanais");
  if(p&&c){ p.classList.toggle("active",t==="painel"); c.classList.toggle("active",t==="canais"); }
}

async function viewEquipe(){
  const v=$("#view"); v.innerHTML='<div class="muted" style="padding:20px">Carregando…</div>';
  const [cli,neg,leads,apr,tar,logs,met] = await Promise.all([
    sb.from("clientes").select("id,nome,servicos,mrr,status"),
    sb.from("negocios").select("estagio,valor_mensal"),
    sb.from("leads").select("status"),
    sb.from("aprovacoes").select("tipo,titulo,solicitante,status").eq("status","pendente"),
    sb.from("tarefas").select("status"),
    sb.from("agent_logs").select("agente,acao,resultado,criado_em").order("criado_em",{ascending:false}).limit(8),
    sb.from("metricas").select("chave,valor,clientes(nome)").order("criado_em",{ascending:false}).limit(8),
  ]);
  const clientes=cli.data||[], negocios=neg.data||[], aprov=apr.data||[];
  const mrr=clientes.filter(c=>c.status==="ativo").reduce((s,c)=>s+Number(c.mrr||0),0);
  const ativos=clientes.filter(c=>c.status==="ativo").length;
  const abertos=negocios.filter(n=>!["fechado","perdido"].includes(n.estagio));
  const pipeVal=abertos.reduce((s,n)=>s+Number(n.valor_mensal||0),0);
  const byStage={}; abertos.forEach(n=>{byStage[n.estagio]=(byStage[n.estagio]||{n:0,v:0}); byStage[n.estagio].n++; byStage[n.estagio].v+=Number(n.valor_mensal||0);});
  const order=["qualificado","reuniao","proposta"]; const maxN=Math.max(1,...Object.values(byStage).map(x=>x.n));
  const tcount={}; (tar.data||[]).forEach(t=>tcount[t.status]=(tcount[t.status]||0)+1);

  v.innerHTML = `
  <div class="kpis">
    <div class="kpi"><div class="label">MRR ativo</div><div class="val green">${brl(mrr)}</div></div>
    <div class="kpi"><div class="label">Clientes ativos</div><div class="val">${ativos}</div></div>
    <div class="kpi"><div class="label">Pipeline aberto</div><div class="val blue">${brl(pipeVal)}</div></div>
    <div class="kpi"><div class="label">Negócios abertos</div><div class="val">${abertos.length}</div></div>
    <div class="kpi"><div class="label">Leads</div><div class="val">${(leads.data||[]).length}</div></div>
    <div class="kpi"><div class="label">Aprovações</div><div class="val amber">${aprov.length}</div></div>
  </div>
  <div class="card">
    <h2>⏳ Fila de aprovações</h2>
    ${aprov.length? aprov.map(a=>`<div class="appr"><div><b>${esc(a.titulo)}</b><div class="muted">${esc(a.tipo)} · ${esc(a.solicitante)}</div></div></div>`).join("") : '<div class="muted">Nada pendente.</div>'}
  </div>
  <div class="grid2">
    <div class="card"><h2>📊 Pipeline</h2>
      ${order.filter(s=>byStage[s]).map(s=>`<div class="stage"><div class="lbl">${s}</div><div class="bar" style="width:${(byStage[s].n/maxN)*160+20}px"></div><div class="num">${byStage[s].n} · ${brl(byStage[s].v)}</div></div>`).join("")||'<div class="muted">Sem negócios.</div>'}
    </div>
    <div class="card"><h2>✅ Tarefas</h2>
      <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:6px">
        <div><div style="font-size:22px;font-weight:800;color:#1d4ed8">${tcount.fazendo||0}</div><div class="muted">fazendo</div></div>
        <div><div style="font-size:22px;font-weight:800;color:#854d0e">${tcount.pendente||0}</div><div class="muted">pendentes</div></div>
        <div><div style="font-size:22px;font-weight:800;color:#15803d">${tcount.concluida||0}</div><div class="muted">concluídas</div></div>
      </div>
    </div>
  </div>
  <div class="card"><h2>👥 Clientes</h2>
    <table><thead><tr><th>Cliente</th><th>Serviços</th><th>MRR</th><th>Status</th></tr></thead><tbody>
    ${clientes.map(c=>`<tr><td>${esc(c.nome)}</td><td class="muted">${(Array.isArray(c.servicos)?c.servicos:[]).join(", ")}</td><td>${brl(c.mrr)}</td><td><span class="pill s-${esc(c.status)}">${esc(c.status)}</span></td></tr>`).join("")||'<tr><td colspan="4" class="muted">Sem clientes.</td></tr>'}
    </tbody></table>
  </div>
  <div class="grid2">
    <div class="card"><h2>📈 Métricas recentes</h2>
      ${(met.data||[]).map(m=>`<span class="metric">${esc(m.clientes&&m.clientes.nome)} · ${esc(m.chave).toUpperCase()}: <b>${m.valor}</b></span>`).join("")||'<div class="muted">Sem métricas.</div>'}
    </div>
    <div class="card"><h2>🤖 Atividade da equipe</h2>
      ${(logs.data||[]).map(l=>`<div class="log"><b>${esc(l.agente)}</b> — ${esc(l.acao)}<div class="r">${esc(l.resultado)}</div></div>`).join("")||'<div class="muted">Sem registros.</div>'}
    </div>
  </div>`;
}

async function viewCanais(){
  const v=$("#view"); v.innerHTML='<div class="muted" style="padding:20px">Carregando…</div>';
  const [ce,cw] = await Promise.all([
    sb.from("vw_canais_email").select("*").order("criado_em",{ascending:false}),
    sb.from("vw_canais_whatsapp").select("*").order("criado_em",{ascending:false}),
  ]);
  v.innerHTML = `
  <div class="hint">🔒 As senhas de SMTP e tokens da Evolution são guardados de forma segura: depois de salvos, <b>não aparecem mais aqui</b> — só os robôs de envio (no servidor) os usam. Constância garantida: cada lead/cliente mantém sempre o mesmo e-mail e número usados no primeiro contato.</div>

  <div class="grid2">
    <div class="card">
      <h2>✉️ Adicionar e-mail (SMTP)</h2>
      <div class="formrow">
        <div><label>Apelido</label><input id="e_nome" placeholder="Comercial 1"></div>
        <div><label>Nome exibido</label><input id="e_fromnome" placeholder="Funil Vivo"></div>
      </div>
      <label>E-mail (from)</label><input id="e_email" placeholder="contato@funilvivo.com.br">
      <div class="formrow">
        <div><label>Servidor SMTP</label><input id="e_host" placeholder="smtp.dominio.com"></div>
        <div><label>Porta</label><input id="e_port" value="587"></div>
      </div>
      <div class="formrow">
        <div><label>Usuário SMTP</label><input id="e_user" placeholder="contato@funilvivo.com.br"></div>
        <div><label>Senha SMTP</label><input id="e_pass" type="password" placeholder="••••••••"></div>
      </div>
      <button class="btn block" id="addEmail">Salvar e-mail</button>
      <div class="msg" id="emailMsg"></div>
    </div>

    <div class="card">
      <h2>🟢 Adicionar WhatsApp (Evolution)</h2>
      <label>Apelido</label><input id="w_nome" placeholder="WhatsApp Comercial">
      <label>URL da API</label><input id="w_url" placeholder="https://evolution.seuservidor.com">
      <label>Token (API Key)</label><input id="w_token" type="password" placeholder="••••••••">
      <div class="formrow">
        <div><label>Instância</label><input id="w_inst" placeholder="funilvivo"></div>
        <div><label>Número</label><input id="w_num" placeholder="5511999999999"></div>
      </div>
      <button class="btn block" id="addWa">Salvar WhatsApp</button>
      <div class="msg" id="waMsg"></div>
    </div>
  </div>

  <div class="card">
    <h2>✉️ E-mails configurados</h2>
    <table><thead><tr><th>Apelido</th><th>E-mail</th><th>SMTP</th><th>Status</th><th>Ativo</th><th></th></tr></thead><tbody id="listEmail">
    ${(ce.data||[]).map(c=>rowEmail(c)).join("")||'<tr><td colspan="6" class="muted">Nenhum e-mail ainda.</td></tr>'}
    </tbody></table>
  </div>

  <div class="card">
    <h2>🟢 WhatsApp configurados</h2>
    <table><thead><tr><th>Apelido</th><th>Número</th><th>Instância</th><th>Status</th><th>Ativo</th><th></th></tr></thead><tbody id="listWa">
    ${(cw.data||[]).map(c=>rowWa(c)).join("")||'<tr><td colspan="6" class="muted">Nenhum WhatsApp ainda.</td></tr>'}
    </tbody></table>
    <div class="muted" style="margin-top:8px">Salve o WhatsApp, clique em <b>Criar instância</b>, depois <b>Conectar (QR)</b> e leia o código no app do WhatsApp.</div>
  </div>

  <div id="qrModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:50">
    <div style="background:#fff;border-radius:14px;padding:22px;max-width:340px;text-align:center">
      <h2 style="margin:0 0 8px;color:#1F3864;font-size:16px">Conectar WhatsApp</h2>
      <div id="qrBody" class="muted">Gerando QR…</div>
      <button class="btn block" id="qrClose" style="margin-top:14px">Fechar</button>
    </div>
  </div>`;

  $("#addEmail").onclick = addEmail;
  $("#addWa").onclick = addWa;
  bindChannelActions();
}

function rowEmail(c){
  return `<tr>
    <td>${esc(c.nome)}</td><td>${esc(c.from_email)}</td>
    <td class="muted">${esc(c.smtp_host||"")}:${esc(c.smtp_port||"")}</td>
    <td><span class="pill s-${esc(c.status)}">${esc(c.status)}</span></td>
    <td>${c.ativo?"Sim":"Não"}</td>
    <td><button class="btn sm ghost" data-tgl-email="${c.id}" data-now="${c.ativo}">${c.ativo?"Desativar":"Ativar"}</button>
        <button class="btn sm sec" data-del-email="${c.id}">Excluir</button></td>
  </tr>`;
}
function rowWa(c){
  return `<tr>
    <td>${esc(c.nome)}</td><td>${esc(c.numero||"")}</td><td class="muted">${esc(c.instancia||"")}</td>
    <td><span class="pill s-${esc(c.status)}">${esc(c.status)}</span></td>
    <td>${c.ativo?"Sim":"Não"}</td>
    <td style="white-space:nowrap">
        <button class="btn sm ghost" data-wa-create="${c.id}">Criar inst.</button>
        <button class="btn sm" data-wa-qr="${c.id}">Conectar (QR)</button>
        <button class="btn sm ghost" data-wa-status="${c.id}">Atualizar</button>
        <button class="btn sm ghost" data-wa-logout="${c.id}">Desconectar</button>
        <button class="btn sm ghost" data-tgl-wa="${c.id}" data-now="${c.ativo}">${c.ativo?"Desativar":"Ativar"}</button>
        <button class="btn sm sec" data-del-wa="${c.id}">Excluir</button></td>
  </tr>`;
}

async function addEmail(){
  const m=$("#emailMsg"); m.className="msg";
  const rec={ nome:$("#e_nome").value.trim(), from_nome:$("#e_fromnome").value.trim(), from_email:$("#e_email").value.trim(),
    smtp_host:$("#e_host").value.trim(), smtp_port:parseInt($("#e_port").value)||587, smtp_user:$("#e_user").value.trim(), smtp_senha:$("#e_pass").value };
  if(!rec.nome||!rec.from_email){ m.className="msg err"; m.textContent="Preencha apelido e e-mail."; return; }
  m.textContent="Salvando…";
  const { error } = await sb.from("canais_email").insert(rec);   // sem .select() → senha não volta
  if(error){ m.className="msg err"; m.textContent="Erro: "+error.message; return; }
  m.className="msg ok"; m.textContent="E-mail salvo!"; viewCanais();
}
async function addWa(){
  const m=$("#waMsg"); m.className="msg";
  const rec={ nome:$("#w_nome").value.trim(), evolution_url:$("#w_url").value.trim(), evolution_token:$("#w_token").value,
    instancia:$("#w_inst").value.trim(), numero:$("#w_num").value.trim() };
  if(!rec.nome){ m.className="msg err"; m.textContent="Preencha o apelido."; return; }
  m.textContent="Salvando…";
  const { error } = await sb.from("canais_whatsapp").insert(rec);
  if(error){ m.className="msg err"; m.textContent="Erro: "+error.message; return; }
  m.className="msg ok"; m.textContent="WhatsApp salvo!"; viewCanais();
}

function bindChannelActions(){
  document.querySelectorAll("[data-tgl-email]").forEach(b=>b.onclick=async()=>{
    await sb.from("canais_email").update({ativo: b.dataset.now!=="true"}).eq("id", b.dataset.tglEmail); viewCanais();
  });
  document.querySelectorAll("[data-del-email]").forEach(b=>b.onclick=async()=>{
    if(confirm("Excluir este e-mail?")){ await sb.from("canais_email").delete().eq("id", b.dataset.delEmail); viewCanais(); }
  });
  document.querySelectorAll("[data-tgl-wa]").forEach(b=>b.onclick=async()=>{
    await sb.from("canais_whatsapp").update({ativo: b.dataset.now!=="true"}).eq("id", b.dataset.tglWa); viewCanais();
  });
  document.querySelectorAll("[data-del-wa]").forEach(b=>b.onclick=async()=>{
    if(confirm("Excluir este WhatsApp?")){ await sb.from("canais_whatsapp").delete().eq("id", b.dataset.delWa); viewCanais(); }
  });
  // Ações via backend (Evolution)
  document.querySelectorAll("[data-wa-create]").forEach(b=>b.onclick=async()=>{
    b.disabled=true; b.textContent="Criando…";
    try{ await apiCall(`/wa/${b.dataset.waCreate}/create`,"POST"); alert("Instância criada! Agora clique em Conectar (QR)."); }
    catch(e){ alert("Erro: "+e.message); } finally{ viewCanais(); }
  });
  document.querySelectorAll("[data-wa-status]").forEach(b=>b.onclick=async()=>{
    try{ const r=await apiCall(`/wa/${b.dataset.waStatus}/status`); alert("Status: "+r.state); }
    catch(e){ alert("Erro: "+e.message); } finally{ viewCanais(); }
  });
  document.querySelectorAll("[data-wa-logout]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Desconectar este WhatsApp?")) return;
    try{ await apiCall(`/wa/${b.dataset.waLogout}/logout`,"POST"); alert("Desconectado."); }
    catch(e){ alert("Erro: "+e.message); } finally{ viewCanais(); }
  });
  document.querySelectorAll("[data-wa-qr]").forEach(b=>b.onclick=()=>openQr(b.dataset.waQr));

  const modal=$("#qrModal"), closeBtn=$("#qrClose");
  if(closeBtn) closeBtn.onclick=()=>{ modal.style.display="none"; if(window._qrTimer) clearInterval(window._qrTimer); };
}

async function openQr(id){
  const modal=$("#qrModal"), body=$("#qrBody");
  modal.style.display="flex"; body.innerHTML="Gerando QR…";
  async function load(){
    try{
      const r=await apiCall(`/wa/${id}/qr`);
      if(r.qr){ body.innerHTML=`<img src="${r.qr}" style="width:260px;height:260px"><div class="muted" style="margin-top:8px">Abra o WhatsApp → Aparelhos conectados → Conectar aparelho e leia o código.</div>`; }
      else if(r.code){ body.innerHTML=`<div style="font-size:13px">Código de pareamento:</div><div style="font-size:22px;font-weight:800;letter-spacing:2px">${esc(r.code)}</div>`; }
      else { body.innerHTML='<div class="muted">Sem QR retornado. Tente Criar instância primeiro.</div>'; }
    }catch(e){ body.innerHTML='<div class="msg err">Erro: '+esc(e.message)+'</div>'; }
  }
  await load();
  // re-checa status a cada 5s; quando conectar, fecha
  if(window._qrTimer) clearInterval(window._qrTimer);
  window._qrTimer=setInterval(async()=>{
    try{ const s=await apiCall(`/wa/${id}/status`); if(s.state==="open"){ clearInterval(window._qrTimer); body.innerHTML='<div class="msg ok" style="font-size:15px">✅ Conectado!</div>'; setTimeout(()=>{modal.style.display="none";viewCanais();},1500);} }catch(_){}
  }, 5000);
}

async function viewCliente(){
  const v=$("#view"); v.innerHTML='<div class="muted" style="padding:20px">Carregando…</div>';
  const [cli,camp,cont,rel,met] = await Promise.all([
    sb.from("clientes").select("nome,servicos,status,mrr"),
    sb.from("campanhas").select("plataforma,objetivo,orcamento,status"),
    sb.from("conteudo").select("data_publicacao,formato,titulo,status").order("data_publicacao",{ascending:false}).limit(15),
    sb.from("relatorios").select("tipo,periodo,criado_em").order("criado_em",{ascending:false}).limit(10),
    sb.from("metricas").select("chave,valor,periodo").order("criado_em",{ascending:false}).limit(12),
  ]);
  const meu=(cli.data&&cli.data[0])||{nome:"Cliente"};
  v.innerHTML = `
  <div class="card">
    <h2>Bem-vindo(a) — ${esc(meu.nome)}</h2>
    <div class="muted">Serviços: ${(Array.isArray(meu.servicos)?meu.servicos:[]).join(", ")||"—"} · Status: <span class="pill s-${esc(meu.status)}">${esc(meu.status||"")}</span></div>
  </div>
  <div class="card"><h2>📈 Seus resultados</h2>
    ${(met.data||[]).length? (met.data||[]).map(m=>`<span class="metric">${esc(m.chave).toUpperCase()}: <b>${m.valor}</b></span>`).join("") : '<div class="muted">Ainda sem métricas publicadas.</div>'}
  </div>
  <div class="grid2">
    <div class="card"><h2>🎯 Campanhas</h2>
      <table><thead><tr><th>Plataforma</th><th>Objetivo</th><th>Status</th></tr></thead><tbody>
      ${(camp.data||[]).map(c=>`<tr><td>${esc(c.plataforma)}</td><td class="muted">${esc(c.objetivo)}</td><td><span class="pill s-${esc(c.status)}">${esc(c.status)}</span></td></tr>`).join("")||'<tr><td colspan="3" class="muted">Sem campanhas.</td></tr>'}
      </tbody></table>
    </div>
    <div class="card"><h2>🗓️ Conteúdo</h2>
      <table><thead><tr><th>Data</th><th>Formato</th><th>Status</th></tr></thead><tbody>
      ${(cont.data||[]).map(c=>`<tr><td>${esc(c.data_publicacao||"")}</td><td>${esc(c.formato)}</td><td><span class="pill s-${esc(c.status)}">${esc(c.status)}</span></td></tr>`).join("")||'<tr><td colspan="3" class="muted">Sem conteúdo.</td></tr>'}
      </tbody></table>
    </div>
  </div>
  <div class="card"><h2>📄 Relatórios</h2>
    <table><thead><tr><th>Tipo</th><th>Período</th><th>Data</th></tr></thead><tbody>
    ${(rel.data||[]).map(r=>`<tr><td>${esc(r.tipo)}</td><td>${esc(r.periodo)}</td><td class="muted">${esc((r.criado_em||"").slice(0,10))}</td></tr>`).join("")||'<tr><td colspan="3" class="muted">Sem relatórios.</td></tr>'}
    </tbody></table>
  </div>`;
}

boot();
</script>
